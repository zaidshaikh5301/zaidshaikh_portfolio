<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Screenshot placeholder for the Noor Tailor storefront">
  <defs>
    <linearGradient id="ntHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6dc"/>
      <stop offset="1" stop-color="#e3d6c8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#fbf8f4"/>

  <!-- header -->
  <rect x="0" y="0" width="800" height="52" fill="#ffffff"/>
  <text x="32" y="34" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#2a2622" letter-spacing="1.5">NOOR TAILOR</text>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#7a7268">
    <text x="470" y="32">Home</text>
    <text x="524" y="32">Catalogue</text>
    <text x="604" y="32">About</text>
    <text x="656" y="32">Contact</text>
  </g>
  <circle cx="752" cy="26" r="12" fill="none" stroke="#7a7268" stroke-width="1.5"/>

  <!-- hero -->
  <rect x="0" y="52" width="800" height="176" fill="url(#ntHero)"/>
  <text x="48" y="126" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#2a2622">Tailored to you,</text>
  <text x="48" y="160" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#2a2622">crafted to last.</text>
  <rect x="48" y="178" width="112" height="26" rx="13" fill="#2a2622"/>
  <text x="104" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fbf8f4">Order now</text>

  <g fill="#d8c8b6" stroke="#c9b6a1">
    <path d="M540 90l38-22 34 20-8 8-8-4v58h-52v-58l-8 4z"/>
    <path d="M628 96l32-20 30 18-7 8-7-4v54h-46v-54l-7 4z"/>
  </g>

  <!-- category strip -->
  <text x="32" y="266" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#2a2622">Shop by category</text>
  <g>
    <rect x="32" y="280" width="168" height="104" rx="8" fill="#efe7dd" stroke="#e0d5c7"/>
    <rect x="216" y="280" width="168" height="104" rx="8" fill="#efe7dd" stroke="#e0d5c7"/>
    <rect x="400" y="280" width="168" height="104" rx="8" fill="#efe7dd" stroke="#e0d5c7"/>
    <rect x="584" y="280" width="184" height="104" rx="8" fill="#efe7dd" stroke="#e0d5c7"/>
  </g>
  <g fill="#c9b6a1">
    <path d="M92 300l24-14 22 13-5 5-5-3v36h-32v-36l-5 3z"/>
    <path d="M276 300l24-14 22 13-5 5-5-3v36h-32v-36l-5 3z"/>
    <path d="M460 300l24-14 22 13-5 5-5-3v36h-32v-36l-5 3z"/>
    <path d="M644 300l24-14 22 13-5 5-5-3v36h-32v-36l-5 3z"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#7a7268" text-anchor="middle">
    <text x="116" y="370">Shirts</text>
    <text x="300" y="370">Kurta</text>
    <text x="484" y="370">Blazer</text>
    <text x="676" y="370">Wedding</text>
  </g>

  <!-- footer band -->
  <rect x="0" y="404" width="800" height="46" fill="#2a2622"/>
  <text x="32" y="432" font-family="system-ui,sans-serif" font-size="11" fill="#cfc7bd">Navsari, Gujarat &#183; Custom orders on request</text>
  <text x="768" y="432" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8b8378">screenshot placeholder</text>
</svg>
