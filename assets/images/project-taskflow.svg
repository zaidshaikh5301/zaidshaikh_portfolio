<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Screenshot placeholder for the TaskFlow task board, showing three columns of task cards">
  <defs>
    <linearGradient id="tfG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191918"/>
      <stop offset="1" stop-color="#232120"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tfG)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="800" height="34" fill="#0e0e0d"/>
  <circle cx="20" cy="17" r="5" fill="#3d3a35"/>
  <circle cx="38" cy="17" r="5" fill="#3d3a35"/>
  <circle cx="56" cy="17" r="5" fill="#3d3a35"/>
  <rect x="80" y="8" width="300" height="18" rx="9" fill="#1c1b19"/>

  <!-- top bar -->
  <rect x="0" y="34" width="800" height="52" fill="#171716"/>
  <text x="24" y="65" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f3f1ee">TaskFlow</text>
  <rect x="0" y="85" width="800" height="1" fill="#2b2b28"/>
  <rect x="640" y="50" width="136" height="22" rx="11" fill="#b8410e" opacity="0.85"/>
  <text x="708" y="65" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#fff7f3">New task</text>

  <!-- three columns -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8c8880">
    <text x="24" y="106">TO DO</text>
    <text x="290" y="106">IN PROGRESS</text>
    <text x="556" y="106">DONE</text>
  </g>

  <!-- column 1 -->
  <rect x="16" y="118" width="240" height="300" rx="8" fill="#1b1b19" stroke="#2b2b28"/>
  <rect x="28" y="132" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <rect x="28" y="192" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <rect x="28" y="252" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <g fill="#3a3733">
    <rect x="40" y="146" width="120" height="8" rx="4"/>
    <rect x="40" y="164" width="76" height="7" rx="3.5"/>
    <rect x="40" y="206" width="140" height="8" rx="4"/>
    <rect x="40" y="224" width="90" height="7" rx="3.5"/>
    <rect x="40" y="266" width="104" height="8" rx="4"/>
    <rect x="40" y="284" width="132" height="7" rx="3.5"/>
  </g>
  <circle cx="232" cy="178" r="5" fill="#b8410e" opacity="0.7"/>
  <circle cx="232" cy="238" r="5" fill="#3d3a35"/>
  <circle cx="232" cy="298" r="5" fill="#3d3a35"/>

  <!-- column 2 (highlighted as the active wip column) -->
  <rect x="282" y="118" width="240" height="300" rx="8" fill="#1b1b19" stroke="#b8410e" stroke-opacity="0.45"/>
  <rect x="294" y="132" width="216" height="68" rx="6" fill="#242422" stroke="#33312d"/>
  <rect x="294" y="208" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <rect x="294" y="268" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <g fill="#3a3733">
    <rect x="306" y="148" width="132" height="8" rx="4"/>
    <rect x="306" y="166" width="98" height="7" rx="3.5"/>
    <rect x="306" y="182" width="70" height="7" rx="3.5"/>
    <rect x="306" y="222" width="116" height="8" rx="4"/>
    <rect x="306" y="240" width="84" height="7" rx="3.5"/>
    <rect x="306" y="282" width="128" height="8" rx="4"/>
    <rect x="306" y="300" width="64" height="7" rx="3.5"/>
  </g>
  <circle cx="498" cy="194" r="5" fill="#b8410e"/>
  <circle cx="498" cy="254" r="5" fill="#3d3a35"/>
  <circle cx="498" cy="314" r="5" fill="#3d3a35"/>

  <!-- column 3 -->
  <rect x="548" y="118" width="240" height="300" rx="8" fill="#1b1b19" stroke="#2b2b28"/>
  <rect x="560" y="132" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <rect x="560" y="192" width="216" height="52" rx="6" fill="#242422" stroke="#33312d"/>
  <g fill="#3a3733">
    <rect x="572" y="146" width="124" height="8" rx="4"/>
    <rect x="572" y="164" width="88" height="7" rx="3.5"/>
    <rect x="572" y="206" width="108" height="8" rx="4"/>
    <rect x="572" y="224" width="72" height="7" rx="3.5"/>
  </g>
  <g stroke="#5a8a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M764 156l5 5 8-11"/>
    <path d="M764 216l5 5 8-11"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#6f6a62">screenshot placeholder &#183; assets/images/project-taskflow.svg</text>
</svg>
