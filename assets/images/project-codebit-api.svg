<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Screenshot placeholder for the CodeBit API Swagger documentation">
  <rect width="800" height="450" fill="#f4f2ee"/>
  <rect x="0" y="0" width="220" height="450" fill="#1c1b19"/>
  <text x="24" y="46" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="19" font-weight="700" fill="#f3f1ee">CodeBit API</text>
  <rect x="24" y="60" width="80" height="4" rx="2" fill="#b8410e"/>

  <g font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#8c8880">
    <text x="24" y="110">GET</text><text x="80" y="110" fill="#c9c5bd">/api/projects</text>
    <text x="24" y="148">GET</text><text x="80" y="148" fill="#c9c5bd">/api/projects/:id</text>
    <text x="24" y="186">POST</text><text x="80" y="186" fill="#c9c5bd">/api/auth/register</text>
    <text x="24" y="224">POST</text><text x="80" y="224" fill="#c9c5bd">/api/auth/login</text>
    <text x="24" y="262">GET</text><text x="80" y="262" fill="#c9c5bd">/api/tasks</text>
    <text x="24" y="300">WS</text><text x="80" y="300" fill="#c9c5bd">/socket.io</text>
  </g>

  <rect x="220" y="0" width="580" height="52" fill="#ffffff"/>
  <text x="248" y="33" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1b1a18">Create a project</text>

  <rect x="248" y="76" width="524" height="30" rx="6" fill="#e6e2da"/>
  <text x="262" y="96" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#7a746a">Authorization: Bearer &lt;token&gt;</text>

  <g>
    <rect x="248" y="126" width="524" height="34" fill="#fff" stroke="#ddd8cf"/>
    <rect x="248" y="160" width="524" height="34" fill="#fff" stroke="#ddd8cf"/>
    <rect x="248" y="194" width="524" height="34" fill="#fff" stroke="#ddd8cf"/>
    <rect x="248" y="228" width="524" height="120" fill="#fff" stroke="#ddd8cf"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#9b968d">
    <text x="262" y="147">title</text>
    <text x="262" y="181">description</text>
    <text x="262" y="215">tags</text>
    <text x="262" y="247">example</text>
  </g>
  <rect x="576" y="250" width="86" height="28" rx="6" fill="#b8410e"/>
  <text x="619" y="268" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#fff7f3">Execute</text>

  <rect x="248" y="368" width="524" height="56" rx="6" fill="#efece6" stroke="#ddd8cf"/>
  <g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#a5a09a">
    <text x="262" y="390">201 Created</text>
    <text x="262" y="408">&#123; "message": "Project created", "data": &#123; ... &#125; &#125;</text>
  </g>

  <text x="484" y="440" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#9b968d">screenshot placeholder &#183; project-codebit-api.svg</text>
</svg>
